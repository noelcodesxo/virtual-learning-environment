services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:8b
      - EXAM_BUILDER_ENABLED=${EXAM_BUILDER_ENABLED:-false}
      - EXAM_MODEL=${EXAM_MODEL:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
